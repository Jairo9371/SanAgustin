{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Saldos Pendientes de Aseguradoras</h2>
    
    <div class="card mb-4">
        <div class="card-body">
            <form method="GET" action="" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Filtrar por Aseguradora:</label>
                    <input type="text" name="aseguradora" class="form-control" placeholder="Ej. Seguros Universales...">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Buscar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Aseguradora</th>
                    <th>Facturas Pendientes</th>
                    <th>Monto Pendiente</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Seguros Universales</td>
                    <td>4</td>
                    <td>Q 1,200.00</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
