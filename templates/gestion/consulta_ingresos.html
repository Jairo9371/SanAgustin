{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Ingresos por Sede Hospitalaria</h2>
    
    <div class="card mb-4">
        <div class="card-body">
            <form method="GET" action="" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Filtrar por Sede:</label>
                    <input type="text" name="sede" class="form-control" placeholder="Ej. Hospital Central...">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Buscar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Sede</th>
                    <th>Honorarios</th>
                    <th>Medicamentos</th>
                    <th>Exámenes</th>
                    <th>Ingreso Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Hospital Central San Agustín</td>
                    <td>Q 1,500.00</td>
                    <td>Q 350.00</td>
                    <td>Q 200.00</td>
                    <td>Q 2,050.00</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
